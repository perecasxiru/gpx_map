# Whenever GPX files are pushed to tracks/ (from Termux, the GitHub web UI, or the API),
# register them in tracks_info.js and commit the result. GitHub Pages then redeploys.
name: Register new tracks

on:
  push:
    branches: [master]
    paths: ["tracks/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: register-tracks
  cancel-in-progress: false

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync tracks_info.js with tracks/
        run: python3 newtrack.py

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git commit -am "Auto: register new tracks"
          git pull --rebase
          git push
