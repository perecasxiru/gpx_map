# Whenever GPX files or tags change (from Termux, the GitHub web UI, or the API),
# register new tracks in tracks_info.js, rebuild tracks_data.json and commit the result.
# GitHub Pages then redeploys.
name: Register new tracks

on:
  push:
    branches: [master]
    paths: ["tracks/**", "tracks_info.js", "newtrack.py", "scripts/build_tracks.py"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: register-tracks
  cancel-in-progress: false

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync tracks_info.js and rebuild tracks_data.json
        run: python3 newtrack.py

      - name: Commit changes
        run: |
          git add tracks_info.js tracks_data.json
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git commit -m "Auto: register tracks and rebuild tracks_data.json"
          git pull --rebase
          git push
